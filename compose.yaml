# compose.yaml — DEVELOPMENT stack.
#
# Why the bind mount below is RIGHT here and WRONG in compose.prod.yaml (rubric G4):
# in development you want the container to see your source as you save it — hot
# reload against an environment that otherwise mirrors production. In production
# the image must be immutable and contain the built artefact; a live checkout of
# whatever a developer last saved is not a release, it is a mood.
name: civicpulse

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:8080"
    environment:
      BACKEND_URL: backend:8000
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-simulated}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama-3.1-8b-instant}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434/v1}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000" # dev convenience only — never published in compose.prod.yaml
    volumes:
      - ./backend:/app # dev hot reload; absent from compose.prod.yaml on purpose
    networks:
      - edge
      - internal
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # pgdata: the durable one — the whole persistence contract lives here.
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal # no route to the outside world, no route for the frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  cache:
    image: redis:7-alpine
    # AOF on: the rate-limiter counters must survive a restart — a limiter that
    # forgets on restart opens a window exactly when the system was unstable.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  ollama:
    image: ollama/ollama:0.11.4
    profiles: ["ollama"] # opt-in: never pulled by default runs or CI
    volumes:
      # model weights — so you do not re-pull ~800 MB on every `up`
      - ollama_models:/root/.ollama
    networks:
      - edge # it must download models; an internal network cannot reach the internet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M

networks:
  edge:
    driver: bridge # frontend ↔ backend, and the backend's egress to hosted LLMs
  internal:
    driver: bridge
    internal: true # database + cache: no route out, no route in from the frontend

volumes:
  pgdata:
  redisdata:
  ollama_models:
