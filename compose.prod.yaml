# compose.prod.yaml — DEPLOY stack. No build: key anywhere; images come from GHCR.
#
# Why there is no bind mount here (rubric G4): a deploy image is immutable and
# contains the built artefact. Mounting a developer's live source checkout into
# production means "production" runs whatever was last saved on someone's laptop
# — that is not a release, it is a mood. Compose.yaml is where hot reload belongs.
name: civicpulse

services:
  frontend:
    image: ghcr.io/alihaiderbajwa/civicpulse-frontend:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    ports:
      - "8080:8080"
    environment:
      BACKEND_URL: backend:8000
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  backend:
    image: ghcr.io/alihaiderbajwa/civicpulse-backend:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-simulated}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama-3.1-8b-instant}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434/v1}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - edge
      - internal
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  ollama:
    image: ollama/ollama:0.11.4
    profiles: ["ollama"]
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - edge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
  redisdata:
  ollama_models:
