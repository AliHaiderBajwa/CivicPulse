apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - backend.yaml
  - frontend.yaml
  - postgres.yaml
  - redis.yaml
  - services.yaml
  - ingress.yaml
  - hpa.yaml
  - vpa.yaml
  - pdb.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/managed-by: kustomize
