# Non-secret configuration only. Secrets live in secret.yaml (placeholders)
# and real values are created at deploy time from GitHub Secrets / .env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: civicpulse-config
  namespace: civicpulse
  labels:
    app.kubernetes.io/part-of: civicpulse
data:
  POSTGRES_USER: civicpulse
  POSTGRES_DB: civicpulse
  TRIAGE_PROVIDER: simulated
  LLM_BASE_URL: https://api.groq.com/openai/v1
  LLM_MODEL: llama-3.1-8b-instant
  RATE_LIMIT_PER_MIN: "10"
  LOG_LEVEL: INFO
  DATABASE_HOST: database
  REDIS_URL: redis://cache:6379/0
