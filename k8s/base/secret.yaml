# PLACEHOLDERS ONLY — never put a real value here, not even base64-encoded
# (base64 is encoding, not encryption; a real key here costs -15).
# Real values are created at deploy time:
#   kubectl create secret generic civicpulse-secrets \
#     --from-literal=DATABASE_URL=... --from-literal=LLM_API_KEY=... \
#     --from-literal=POSTGRES_PASSWORD=... -n civicpulse
apiVersion: v1
kind: Secret
metadata:
  name: civicpulse-secrets
  namespace: civicpulse
  labels:
    app.kubernetes.io/part-of: civicpulse
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME_AT_DEPLOY_TIME"
  DATABASE_URL: "postgresql+psycopg://civicpulse:REPLACE_ME_AT_DEPLOY_TIME@database:5432/civicpulse"
  LLM_API_KEY: "REPLACE_ME_AT_DEPLOY_TIME"
