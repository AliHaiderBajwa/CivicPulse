# VPA in recommender mode ONLY (updateMode: "Off"). It observes and recommends;
# a human applies the numbers. Auto mode alongside this HPA would fight it:
# VPA raises the CPU request -> computed utilisation drops -> HPA scales in ->
# per-pod load rises -> VPA raises the request -> oscillation. Recommender +
# human decision is current industrial practice for exactly this reason.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: backend-vpa
  namespace: civicpulse
  labels:
    app.kubernetes.io/part-of: civicpulse
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  updatePolicy:
    updateMode: "Off"
