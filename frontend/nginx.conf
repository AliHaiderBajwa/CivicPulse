# CivicPulse site config — nginx template processed by the image entrypoint's
# envsubst step (/etc/nginx/templates/*.template -> /etc/nginx/conf.d/).
# Deploy-time variable: BACKEND_URL (default backend:8000, see Dockerfile).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Non-root: all temp paths under /tmp (writable for the nginx user).
    client_body_temp_path /tmp/nginx-cache/client_temp;
    proxy_temp_path       /tmp/nginx-cache/proxy_temp;
    fastcgi_temp_path     /tmp/nginx-cache/fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx-cache/uwsgi_temp;
    scgi_temp_path        /tmp/nginx-cache/scgi_temp;

    # Container healthcheck target — never proxied.
    location = /healthz {
        access_log off;
        return 200;
    }

    # Backend API. Backend routes are /api/... so the /api prefix is NOT stripped.
    location /api/ {
        proxy_pass http://${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Real client IP chain: incoming X-Forwarded-For + $remote_addr.
        # ($proxy_forwarded is nginx Plus only; this is the OSS equivalent.)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_read_timeout 60s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
